version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: global_smart_zone
      MYSQL_USER: gsz_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=gsz_user
      - DATABASE_PASSWORD=change_me
      - DATABASE_NAME=global_smart_zone

volumes:
  db_data:
    driver: local